services:
  piavpn:
    # No version tags upstream; digest-pinned (bump: pull :latest, copy digest)
    image: thrnz/docker-wireguard-pia:latest@sha256:438c5f910689ee094e0532f296044c0bbcaf15d43490fe241ecf7fe6747ac20d
    container_name: piavpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - LOC=${PIA_LOCATION}
      - USER=${PIA_USER}
      - PASS=${PIA_PASS}
      - LOCAL_NETWORK=${PIA_LOCAL_NETWORK}
      - PORT_FORWARDING=1
      - PORT_PERSIST=1
      - PORT_SCRIPT=/pia-shared/portupdate-qbittorrent.sh
      # qBittorrent WebUI login for PORT_SCRIPT (localhost auth bypass stays off)
      - QBT_USER=${QBT_USER:-}
      - QBT_PASS=${QBT_PASS:-}
    ports:
      - 8090:8090  # Qbittorrent web UI
      - 9696:9696  # Prowlarr
      - 8989:8989  # Sonarr
      - 7878:7878  # Radarr
      - 5055:5055  # Seerr
      - 8080:8080  # SABnzbd
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    volumes:
      - ${DOCKER_ROOT}/pia:/pia
      - ${DOCKER_ROOT}/pia-shared:/pia-shared
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
  qbittorrent:
    network_mode: "service:piavpn"
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    container_name: qbittorrent
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - UMASK_SET=022
      - WEBUI_PORT=8090
    volumes:
      - ${DOCKER_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    healthcheck:
        test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8090 && curl --fail https://google.com"]
        interval: 30s
        timeout: 10s
        retries: 3
    depends_on:
      piavpn:
        condition: service_healthy
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:3.0.2.5780-ls169
    container_name: prowlarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      # Auth is handled by Authelia in Traefik; skip the built-in login
      - PROWLARR__AUTH__METHOD=External
    volumes:
      - ${DOCKER_ROOT}/prowlarr:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    network_mode: "service:piavpn"
    depends_on:
      - piavpn
      - qbittorrent
      - flaresolverr
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    environment:
      - TZ=${TIMEZONE}
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    network_mode: "service:piavpn"
    depends_on:
      piavpn:
        condition: service_healthy
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5
    container_name: sonarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      # Auth is handled by Authelia in Traefik; skip the built-in login
      - SONARR__AUTH__METHOD=External
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_ROOT}/sonarr/config:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://127.0.0.1:8989/sonarr/ping" ]
      interval: 5s
      retries: 10
    network_mode: "service:piavpn"
    depends_on:
      - prowlarr
      - qbittorrent
  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: radarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      # Auth is handled by Authelia in Traefik; skip the built-in login
      - RADARR__AUTH__METHOD=External
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_ROOT}/radarr/config:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://127.0.0.1:7878/radarr/ping" ]
      interval: 5s
      retries: 10
    network_mode: "service:piavpn"
    depends_on:
      - prowlarr
      - qbittorrent
  bazarr:
    # Deliberately NOT in piavpn's namespace, so subtitle traffic leaves from
    # the home IP
    image: lscr.io/linuxserver/bazarr:1.6.2
    container_name: bazarr
    ports:
      - 6767:6767
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://127.0.0.1:6767/bazarr/ping" ]
      interval: 5s
      retries: 10
    depends_on:
      - sonarr
      - radarr
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3
    container_name: sabnzbd
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_ROOT}/sabnzbd:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://127.0.0.1:8080/api?mode=version" ]
      interval: 5s
      retries: 10
    network_mode: "service:piavpn"
    depends_on:
      piavpn:
        condition: service_healthy
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2
    init: true
    container_name: seerr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - LOG_LEVEL=debug
    volumes:
      - ${DOCKER_ROOT}/jellyseerr:/app/config
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    network_mode: "service:piavpn"
    depends_on:
      - sonarr
      - radarr
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.38.0
    container_name: audiobookshelf
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    ports:
      - 13378:80
    volumes:
      - ${DOCKER_ROOT}/audiobookshelf:/config
      - ${DOCKER_ROOT}/audiobookshelf/metadata:/metadata
      - ${DATA_ROOT}/media/audiobooks:/audiobooks
      - ${DATA_ROOT}/media/podcasts:/podcasts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  default:
    name: servarr-nas
