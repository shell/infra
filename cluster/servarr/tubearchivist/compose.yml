services:
  tubearchivist:
    container_name: tubearchivist
    restart: "no"
    image: bbilly1/tubearchivist
    ports:
      - 8095:8000
    volumes:
      - ${DATA_ROOT}/media/youtube:/youtube
      - ${DOCKER_DATA_ROOT}/cache:/cache
    env_file:
      - .env
    environment:
      - ES_URL=http://archivist-es:9200
      - REDIS_CON=redis://archivist-redis:6379
      - HOST_UID=${USER_ID}
      - HOST_GID=${GROUP_ID}
      - TA_HOST=${TA_HOST}
      - TA_USERNAME=${TA_USERNAME}
      - TA_PASSWORD=${TA_PASSWORD}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - TZ=${TIMEZONE:-America/Los_Angeles}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - archivist-es
      - archivist-redis

  archivist-redis:
    image: redis
    container_name: archivist-redis
    restart: "no"
    expose:
      - "6379"
    volumes:
      - ${DOCKER_DATA_ROOT}/redis:/data
    depends_on:
      - archivist-es

  archivist-es:
    image: bbilly1/tubearchivist-es
    container_name: archivist-es
    restart: "no"
    env_file:
      - .env
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - discovery.type=single-node
      - path.repo=/usr/share/elasticsearch/data/snapshot
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${DOCKER_DATA_ROOT}/es:/usr/share/elasticsearch/data
    expose:
      - "9200"

