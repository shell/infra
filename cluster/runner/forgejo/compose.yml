# Forgejo — primary git remote + Actions CI for this repo (docs/forgejo.md).
# Web: https://git.sf.penk.in via Traefik on ts-router (LAN/Tailscale only).
# SSH: 192.168.10.252:2222. Push-mirrors every commit to github.com/shell/infra.
# The Actions runner is a host systemd service (playbooks/forgejo-runner.yml);
# FORGEJO_RUNNER_SECRET in .env is read by that playbook, not by this container.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__DOMAIN=git.sf.penk.in
      - FORGEJO__server__ROOT_URL=https://git.sf.penk.in/
      - FORGEJO__server__SSH_DOMAIN=192.168.10.252
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__server__LANDING_PAGE=login
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=true
      - FORGEJO__openid__ENABLE_OPENID_SIGNIN=false
      - FORGEJO__openid__ENABLE_OPENID_SIGNUP=false
      - FORGEJO__repository__DEFAULT_PRIVATE=private
      - FORGEJO__actions__ENABLED=true
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 3000:3000
      - 2222:22
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
