# https://samber.github.io/awesome-prometheus-alerts/rules
groups:
  - name: Prometheus
    rules:
    - alert: PrometheusTargetMissing
      expr: up{expected_offline!="true"} == 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: 'Scrape target down'
        description: '{{ $labels.job }} target {{ $labels.instance }} is unreachable'
    - alert: PrometheusNotConnectedToAlertmanager
      expr: prometheus_notifications_alertmanagers_discovered < 1
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: 'Prometheus not connected to Alertmanager'
        description: 'No Alertmanager discovered'
