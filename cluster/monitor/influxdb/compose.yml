# InfluxDB 2 — Proxmox pushes host/VM/storage metrics here (Datacenter → Metric
# Server, managed by ansible/playbooks/proxmox-metrics.yml); Grafana reads them
# with Flux (config/dashboards/proxmox-flux.json).
# Web UI: https://influxdb.sf.penk.in (Traefik + Authelia).
#
# DOCKER_INFLUXDB_INIT_* only apply when ./data is empty (first start). Rotating
# the token afterwards means changing it in InfluxDB too, not just in .env.enc.
services:
  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    restart: unless-stopped
    ports:
      - 8086:8086
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:?set in .env.enc}
      - DOCKER_INFLUXDB_INIT_ORG=homelab
      - DOCKER_INFLUXDB_INIT_BUCKET=proxmox
      - DOCKER_INFLUXDB_INIT_RETENTION=90d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:?set in .env.enc}
    volumes:
      - ./data:/var/lib/influxdb2
      - ./config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - monitoring

networks:
  monitoring:
    external: true
