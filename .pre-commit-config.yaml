repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: sops-encrypted
        name: SOPS files must be encrypted
        language: system
        files: '(\.env\.enc|\.secret\.(ya?ml|json)|\.tfvars\.enc|ca_key\.enc|config\.acl\.enc|dell-optiplex/secrets\.yaml)$'
        # Block scalar: the ": " in the echo would otherwise break YAML parsing
        entry: >-
          bash -c 'for f in "$@"; do grep -q "sops" "$f" || { echo "NOT ENCRYPTED: $f"; exit 1; }; done' --
