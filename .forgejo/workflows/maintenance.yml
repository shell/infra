name: Maintenance

# Manual runs. Scheduled runs live in maintenance-weekly.yml / maintenance-daily.yml
# (one cron per file: Forgejo doesn't reliably expose which schedule fired).
on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Maintenance playbook to run'
        required: true
        default: 'maintenance-all'
        type: choice
        options:
          - maintenance-all
          - docker-cleanup
          - host-cleanup
          - proxmox-health
          - update-systems
          - update-proxmox
          - update-service
          - security-hardening
      notify:
        description: 'Send the Telegram summary/alert'
        required: false
        default: false
        type: boolean
      service:
        description: 'update-service only: one compose dir (e.g. immich); empty = all'
        required: false
        default: ''
        type: string

jobs:
  maintenance:
    name: ${{ inputs.playbook }}
    runs-on: self-hosted
    env:
      SF_TELEGRAM_BOT_TOKEN: ${{ secrets.SF_TELEGRAM_BOT_TOKEN }}
      SF_TELEGRAM_CHAT_ID: ${{ secrets.SF_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      # SERVICE goes through env, not ${{ }} in the script, so the free-text
      # input can't inject shell.
      - name: Run selected playbook
        working-directory: ansible
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          echo "### Running ${{ inputs.playbook }} (notify: ${{ inputs.notify }})"
          set -- -e notify_telegram=${{ inputs.notify }}
          if [ "${{ inputs.playbook }}" = "update-service" ]; then
            # Skip hosts that are powered off now and then (inventory maybe_offline)
            set -- "$@" -l 'all:!maybe_offline'
            if [ -n "$SERVICE" ]; then set -- "$@" -e "service=$SERVICE"; fi
          fi
          ansible-playbook playbooks/${{ inputs.playbook }}.yml "$@"
