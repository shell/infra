name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: apt-get update -qq && apt-get install -y -qq yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" \
            cluster/ --no-warnings

  # Host job: needs the docker CLI, which the job container doesn't have.
  # Safe on the host because only the repo owner can push to Forgejo.
  validate-compose:
    name: Validate Docker Compose
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Find and validate compose files
        run: |
          echo "Validating Docker Compose files..."
          ERRORS=0

          for file in $(find cluster -name "compose.yml" -o -name "compose.yaml" -o -name "docker-compose.yml" -o -name "docker-compose.yaml" 2>/dev/null); do
            echo "Checking: $file"
            dir="${file%/*}"
            env_created=false

            # If .env.example exists but .env doesn't, create temporary .env
            if [ -f "$dir/.env.example" ] && [ ! -f "$dir/.env" ]; then
              cp "$dir/.env.example" "$dir/.env"
              env_created=true
            fi

            if ! docker compose -f "$file" config --quiet 2>/dev/null; then
              echo "ERROR: $file failed validation"
              ERRORS=$((ERRORS + 1))
            fi

            # Clean up temporary .env
            if [ "$env_created" = true ]; then
              rm -f "$dir/.env"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS invalid compose file(s)"
            exit 1
          fi
          echo "All compose files valid!"

  # Host job: ansible + collections are already installed on the runner VM
  validate-ansible:
    name: Validate Ansible
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Validate Ansible syntax
        working-directory: ansible
        run: ansible-playbook --syntax-check playbooks/*.yml

  # Container job (never host mode): PRs must not get a shell on the runner host.
  # Full-history scan; fails the run on any finding. Bump version + sha256 together.
  security-scan:
    name: Secret scan (gitleaks)
    runs-on: docker
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  # linux_x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks

      - name: Scan full history
        run: gitleaks git --redact --no-banner --exit-code 1 .
