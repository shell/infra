name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: apt-get update -qq && apt-get install -y -qq yamllint

      # Config: .yamllint.yml at the repo root
      - name: Lint YAML files
        run: yamllint --no-warnings cluster/ ansible/ .forgejo/ .yamllint.yml

  # Host job: needs the docker CLI, which the job container doesn't have.
  # Safe on the host because only the repo owner can push to Forgejo.
  validate-compose:
    name: Validate Docker Compose
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Find and validate compose files
        run: |
          echo "Validating Docker Compose files..."
          ERRORS=0

          for file in $(find cluster -name "compose.yml" -o -name "compose.yaml" -o -name "docker-compose.yml" -o -name "docker-compose.yaml" 2>/dev/null); do
            echo "Checking: $file"
            dir="${file%/*}"
            env_created=false

            # If .env.example exists but .env doesn't, create temporary .env
            if [ -f "$dir/.env.example" ] && [ ! -f "$dir/.env" ]; then
              cp "$dir/.env.example" "$dir/.env"
              env_created=true
            fi

            if ! docker compose -f "$file" config --quiet; then
              echo "ERROR: $file failed validation"
              ERRORS=$((ERRORS + 1))
            fi

            # Clean up temporary .env
            if [ "$env_created" = true ]; then
              rm -f "$dir/.env"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS invalid compose file(s)"
            exit 1
          fi
          echo "All compose files valid!"

  # Host job: ansible + collections are already installed on the runner VM
  validate-ansible:
    name: Validate Ansible
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/ansible-setup

      - name: Validate Ansible syntax
        working-directory: ansible
        run: ansible-playbook --syntax-check playbooks/*.yml

  # Host job: terraform comes from the runner host (playbooks/forgejo-runner.yml).
  # No backend and no secrets: fmt + validate only, so mistakes show up here
  # instead of in terraform.yml right before an apply.
  validate-terraform:
    name: Validate Terraform
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Same provider cache as terraform.yml; safe because capacity is 1
      - name: Use shared provider cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff terraform/

      # Checks every directory and reports all failures, not just the first.
      # Fresh TF_DATA_DIR per dir: init -backend=false still reuses a backend left
      # in an existing .terraform/ (e.g. from terraform.yml), which needs B2 creds.
      - name: Terraform Validate
        run: |
          failed=""
          for dir in terraform/*/; do
            dir=${dir%/}
            echo "=== $dir"
            data=$(mktemp -d)
            if ! (cd "$dir" && export TF_DATA_DIR="$data" \
                  && terraform init -input=false -no-color -backend=false -lockfile=readonly \
                  && terraform validate -no-color); then
              failed="$failed $dir"
            fi
            rm -rf "$data"
          done
          if [ -n "$failed" ]; then
            echo "::error::terraform validate failed in:$failed"
            exit 1
          fi

  # Container job (never host mode): PRs must not get a shell on the runner host.
  # Full-history scan; fails the run on any finding. Bump version + sha256 together.
  security-scan:
    name: Secret scan (gitleaks)
    runs-on: docker
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  # linux_x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tarball cached on the runner's cache server (cache.enabled in
      # forgejo-runner.config.yml.j2). The sha256 check runs on cache hits
      # too, so a poisoned cache entry fails the job instead of running.
      - name: Cache gitleaks tarball
        uses: actions/cache@v4
        with:
          path: ~/.cache/gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}

      - name: Install gitleaks
        run: |
          tgz="$HOME/.cache/gitleaks/gitleaks.tgz"
          if ! echo "${GITLEAKS_SHA256}  $tgz" | sha256sum -c - >/dev/null 2>&1; then
            mkdir -p "$(dirname "$tgz")"
            curl -sSfL -o "$tgz" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          fi
          echo "${GITLEAKS_SHA256}  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C /usr/local/bin gitleaks

      - name: Scan full history
        run: gitleaks git --redact --no-banner --exit-code 1 .
