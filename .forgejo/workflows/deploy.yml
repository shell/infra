name: Deploy

# Docker Compose stacks on docker_hosts. Host configuration (monitoring agents,
# firewall, Proxmox backup/metrics) lives in provision.yml.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ts-router
          - servarr
          - monitor
          - runner
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - status
          - restart
      service:
        description: 'deploy/restart only: one compose dir (e.g. grafana); empty = all'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    name: ${{ inputs.action }} → ${{ inputs.target }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/ansible-setup
        with:
          sops: 'true'

      - name: Quick validation
        run: yamllint --no-warnings cluster/

      # Maps action → playbook and target → host limit, and rejects input that
      # would be silently ignored. `all` skips hosts in the maybe_offline group
      # (inventory/hosts.yml); pick the host explicitly to target one of them.
      - name: Resolve playbook and hosts
        id: plan
        env:
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          case "$ACTION" in
            deploy)  playbook=deploy ;;
            restart) playbook=restart-service ;;
            status)  playbook=status
                     [ -z "$SERVICE" ] || fail "service is only used by deploy and restart" ;;
            *)       fail "unknown action: $ACTION" ;;
          esac
          case "$TARGET" in
            all) limit='docker_hosts:!maybe_offline' ;;
            *)   limit=$TARGET ;;
          esac
          echo "🎯 Target: $TARGET → -l $limit"
          echo "⚡ Action: $ACTION → playbooks/$playbook.yml"
          echo "📦 Service: ${SERVICE:-all}"
          echo "playbook=$playbook" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"

      # Deploying `runner` restarts Forgejo mid-job; the runner reconnects and
      # finishes, but the UI may show the job as failed — check the next status run.
      # Inputs go through env, not ${{ }} in the script, so the free-text service
      # can't inject shell. deploy.yml rejects names no host has. service is only
      # passed when set: restart-service.yml treats a defined-but-empty service as
      # a dir name and would restart in the home directory.
      - name: Run ${{ inputs.action }}
        working-directory: ansible
        env:
          PLAYBOOK: ${{ steps.plan.outputs.playbook }}
          LIMIT: ${{ steps.plan.outputs.limit }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -- -l "$LIMIT"
          if [ -n "$SERVICE" ]; then set -- "$@" -e "service=$SERVICE"; fi
          ansible-playbook "playbooks/$PLAYBOOK.yml" "$@"

      - name: Post-deploy status
        if: inputs.action == 'deploy'
        working-directory: ansible
        env:
          LIMIT: ${{ steps.plan.outputs.limit }}
        run: |
          echo "=== Post-deployment status ==="
          ansible-playbook playbooks/status.yml -l "$LIMIT"
