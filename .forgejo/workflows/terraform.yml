name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform (${{ matrix.directory }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        directory: [cloudflare, b2]
    defaults:
      run:
        working-directory: terraform/${{ matrix.directory }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Provider secrets are read from the 1Password "Homelab" vault
      # (terraform/<dir>/onepassword.tf)
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # terraform and op come from the runner host (playbooks/forgejo-runner.yml)
      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # The plan file can embed sensitive values
      - name: Cleanup plan
        if: always()
        run: rm -f tfplan
