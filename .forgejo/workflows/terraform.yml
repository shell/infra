name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform (${{ matrix.directory }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        # proxmox was retired 2026-11: VMs are protected by PBS backups
        # (ansible/playbooks/proxmox-backup.yml, docs/proxmox-backup.md)
        directory: [cloudflare]
    defaults:
      run:
        working-directory: terraform/${{ matrix.directory }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify SOPS key exists
        run: |
          if [ ! -f "$HOME/.config/sops/age/keys.txt" ]; then
            echo "ERROR: SOPS age key not found"
            exit 1
          fi

      - name: Decrypt secrets
        run: sops -d secrets.auto.tfvars.enc > secrets.auto.tfvars

      # terraform comes from the runner host (/usr/bin/terraform)
      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Cleanup secrets
        if: always()
        run: rm -f secrets.auto.tfvars tfplan
