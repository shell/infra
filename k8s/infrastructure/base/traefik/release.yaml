apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  releaseName: traefik
  targetNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: "41.0.2"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  values:
    service:
      type: LoadBalancer
      annotations:
        # Pin to the first address in the MetalLB pool (k8s/networking) so
        # it's a stable, predictable "front door" IP to point DNS/hosts at.
        metallb.io/loadBalancerIPs: "192.168.10.240"
