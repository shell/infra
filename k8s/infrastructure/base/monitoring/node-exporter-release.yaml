apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  interval: 1h
  releaseName: node-exporter
  targetNamespace: monitoring
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.56.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring