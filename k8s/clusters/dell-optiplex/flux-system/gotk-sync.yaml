# Originally generated by `flux bootstrap`, edited by hand since then: the source
# is Forgejo (primary remote) instead of the GitHub push-mirror, so pushing to
# GitHub can't deploy to the cluster. Re-running `flux bootstrap github` would
# revert this; bootstrap with `flux bootstrap git --url=<below>` instead.
#
# Secret flux-system-forgejo (identity, identity.pub, known_hosts) is created
# out of band: `flux create secret git flux-system-forgejo --url=<below>`. Its
# public key is a read-only deploy key on vlad/infra in Forgejo.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system-forgejo
  url: ssh://git@192.168.10.252:2222/vlad/infra.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/clusters/dell-optiplex
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
