# Stateless; measures LAN throughput to whichever node it lands on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openspeedtest
  namespace: apps-internal
  labels:
    app: openspeedtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openspeedtest
  template:
    metadata:
      labels:
        app: openspeedtest
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user baked into the image
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openspeedtest
          image: openspeedtest/latest:v2.0.8
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
