# Needs the paperless-ngx Secret (PAPERLESS_SECRET_KEY) from the cluster
# overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: apps-internal
  labels:
    app: paperless-ngx
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volumes, SQLite
  selector:
    matchLabels:
      app: paperless-ngx
  template:
    metadata:
      labels:
        app: paperless-ngx
    spec:
      containers:
        - name: paperless-ngx
          # Pinned: bump deliberately, DB migrations run on start
          image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PAPERLESS_REDIS
              value: redis://paperless-redis:6379
            - name: PAPERLESS_URL
              value: https://paperless.sf.penk.in
            - name: PAPERLESS_TIME_ZONE
              value: America/Los_Angeles
            # Extra tesseract language packs, installed on container start
            - name: PAPERLESS_OCR_LANGUAGES
              value: rus
            # The image starts as root and drops to this user
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
            # Keep OCR/consumption from spreading across every host core
            # (paperless sizes these from os.cpu_count(), which ignores the
            # cgroup CPU limit). Slower consumption, lower sustained heat.
            - name: PAPERLESS_TASK_WORKERS
              value: "1"
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "1"
            - name: PAPERLESS_WEBSERVER_WORKERS
              value: "1"
            - name: OMP_THREAD_LIMIT # tesseract's internal threading
              value: "1"
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx
                  key: PAPERLESS_SECRET_KEY
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              # Hard cap (CFS quota): at most 2 of the node's 6 cores
              cpu: "2"
              memory: 4Gi
          # First start installs OCR languages and runs DB migrations
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
              subPath: media
            - name: media
              mountPath: /usr/src/paperless/consume
              subPath: consume
            - name: media
              mountPath: /usr/src/paperless/export
              subPath: export
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
