# data: SQLite DB, search index, classifier model.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: apps-internal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# media: originals/archive/thumbnails (subPath media), plus the consume and
# export folders (subPaths consume, export).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: apps-internal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 45Gi
