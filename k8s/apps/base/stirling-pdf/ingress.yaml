# Reached as https://pdf.sf.penk.in: ts-router Traefik terminates TLS and
# forwards to the cluster Traefik (192.168.10.240) with the Host header.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stirling-pdf
  namespace: apps-internal
spec:
  ingressClassName: traefik
  rules:
    - host: pdf.sf.penk.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stirling-pdf
                port:
                  name: http
