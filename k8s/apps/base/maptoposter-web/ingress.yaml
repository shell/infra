apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maptoposter-web
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: maptoposter.k8s.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maptoposter-web
                port:
                  number: 5000