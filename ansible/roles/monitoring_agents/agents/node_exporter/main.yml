---
# Prometheus node_exporter as a native systemd service via
# prometheus.prometheus.node_exporter. Scrape targets are generated by
# tasks/prometheus_targets.yml.

# Frees port 9100 before the native exporter starts
- name: node_exporter | Stop Docker-based exporter
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/remove_docker_agent.yml"
  vars:
    legacy_container: node-exporter
    legacy_dir: "/home/{{ ansible_user }}/node-exporter"

- name: node_exporter | Install
  ansible.builtin.include_role:
    name: prometheus.prometheus.node_exporter
  vars:
    node_exporter_web_listen_address: "0.0.0.0:{{ node_exporter_port }}"

# UFW access to 9100 is owned by playbooks/firewall.yml (firewall_common_rules)

- name: node_exporter | Wait for metrics endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ node_exporter_port }}/metrics"
    status_code: 200
  register: _ne_health
  until: _ne_health.status == 200
  retries: 10
  delay: 2
  when: not ansible_check_mode
