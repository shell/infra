---
# Generate Prometheus file_sd targets for every host in the `monitored` group
# that runs node_exporter, and push them to the Prometheus host.
# Prometheus watches the file — no restart needed.
#
# Built from the full inventory (not the --limit), so deploying one host never
# drops the others from the list.

- name: Prometheus targets | Create file_sd directory
  ansible.builtin.file:
    path: "{{ prometheus_file_sd_dir }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ prometheus_host }}"
  run_once: true

- name: Prometheus targets | Write node-exporter targets
  ansible.builtin.template:
    src: node-exporter-targets.yml.j2
    dest: "{{ prometheus_file_sd_dir }}/node-exporter.yml"
    mode: "0644"
  delegate_to: "{{ prometheus_host }}"
  run_once: true
