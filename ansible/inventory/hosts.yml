# Homelab Inventory
all:
  vars:
    ansible_user: vlad
    ansible_python_interpreter: /usr/bin/python3

  children:
    # All Docker hosts
    docker_hosts:
      hosts:
        ts-router:
          ansible_host: 192.168.10.141
          docker_compose_dirs:
            - traefik
            - authelia
            # nebula-sync: paused (container stopped, kept) until the
            # replica Pi-hole on the Pi Zero (192.168.10.202) is back
            - dashboard/homarr_v2
            - openspeedtest
          docker_networks:
            - ts-router-net
          node_role: router

        servarr:
          ansible_host: 192.168.10.142
          docker_compose_dirs:
            - immich
            - servarr
            - jellyfin
            # - tubearchivist  # disabled, re-enable when needed
          node_role: media

        tools:
          ansible_host: 192.168.10.143
          docker_compose_dirs: []
          node_role: tools
          # Powered off now and then, being retired: Prometheus target gets
          # expected_offline="true", so PrometheusTargetMissing ignores it
          expected_offline: true

        monitor:
          ansible_host: 192.168.10.230
          docker_compose_dirs:
            - beszel  # hub only; agent comes from playbooks/monitoring.yml
            - influxdb
            - grafana
            - prometheus
            - uptime-kuma
          docker_networks:
            - monitoring
          grafana_admin_users:
            - vlad
          node_role: monitoring

        runner:
          ansible_host: 192.168.10.252
          # CI box: Forgejo + its Actions runner (docs/forgejo.md) — playbooks execute
          # ON this host already, so connect locally instead of SSHing to itself
          # (no SSH key trust was ever established for that loopback connection).
          ansible_connection: local
          docker_compose_dirs:
            - forgejo
          node_role: runner

    # Hosts that get monitoring agents (playbooks/monitoring.yml).
    # Add non-Docker-stack boxes under `hosts:` here (they still need Docker).
    monitored:
      children:
        docker_hosts:
      hosts:
        pve-nuc:

    # Proxmox hypervisors (not managed by default - use `-l proxmox` to target)
    proxmox:
      vars:
        ansible_user: root  # Proxmox uses root
      hosts:
        pve-nuc:
          ansible_host: 192.168.10.120

    # VPS hosts (public-facing, use -l vps_hosts or specific host to target)
    vps_hosts:
      vars:
        ansible_port: 22922
      hosts:
        srv1517572:
          ansible_host: meet.penk.in  # unproxied A record → VPS public IP (terraform/cloudflare/dns.tf)
