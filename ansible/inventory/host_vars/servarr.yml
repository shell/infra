---
# servarr specific variables

beszel_agent_legacy_data_dir: /mnt/data/beszel_agent_data

# Intel iGPU (GVT-g vGPU from pve-nuc) stats via intel_gpu_top.
# card0 is the emulated VGA (1234:1111); card1/renderD128 is the Intel GPU.
beszel_agent_gpus:
  - path: /dev/dri/card1
    type: intel
beszel_agent_additional_devices:
  - device: /dev/dri/renderD128
    mode: rw
beszel_agent_extra_groups:
  - video
  - render

firewall_rules:
  # Rely on Traefik + Authelia (*arr External auth) or have weak auth:
  # Traefik and Homarr only
  - { route: true, from: "{{ firewall_traefik }}", port: 8090, comment: "qBittorrent" }
  - { route: true, from: "{{ firewall_traefik }}", port: 9696, comment: "Prowlarr" }
  - { route: true, from: "{{ firewall_traefik }}", port: 8989, comment: "Sonarr" }
  - { route: true, from: "{{ firewall_traefik }}", port: 7878, comment: "Radarr" }
  - { route: true, from: "{{ firewall_traefik }}", port: 6767, comment: "Bazarr" }
  - { route: true, from: "{{ firewall_traefik }}", port: 8080, comment: "SABnzbd" }
  # Own auth; TVs, phones and apps connect directly
  - { route: true, from: ["{{ firewall_lan }}", "{{ firewall_clients }}"], port: 8096, comment: "Jellyfin" }
  - { route: true, from: ["{{ firewall_lan }}", "{{ firewall_clients }}"], port: 8920, comment: "Jellyfin HTTPS" }
  - { route: true, from: ["{{ firewall_lan }}", "{{ firewall_clients }}"], port: 7359, proto: udp, comment: "Jellyfin discovery" }
  - { route: true, from: ["{{ firewall_lan }}", "{{ firewall_clients }}"], port: 1900, proto: udp, comment: "Jellyfin DLNA" }
  - { route: true, from: ["{{ firewall_lan }}", "{{ firewall_clients }}"], port: 2283, comment: "Immich" }
  - { route: true, from: ["{{ firewall_lan }}", "{{ firewall_clients }}"], port: 80, comment: "Audiobookshelf (host 13378)" }
  - { route: true, from: ["{{ firewall_lan }}", "{{ firewall_clients }}"], port: 5055, comment: "Seerr" }
