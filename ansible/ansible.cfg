[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Don't log module arguments (URLs, headers, passwords) to journald on the
# targets. no_log tasks are censored anyway; this covers everything else.
no_target_syslog = True

# YAML output format (modern approach replacing community.general.yaml)
stdout_callback = ansible.builtin.default
callback_result_format = yaml

# Speed optimizations
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
forks = 10
pipelining = True
# SSH connect timeout (default 10s); all hosts are on the LAN or a fast VPS
timeout = 5

# gathering facts settings
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.cache/ansible-facts
fact_caching_timeout = 86400

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=360s
