---
# Bootstrap a fresh Ubuntu 24.04 VPS — run ONCE as root on port 22
#
# Usage:
#   ansible-playbook playbooks/vps-bootstrap.yml -l srv1517572 -e "ansible_port=22 ansible_user=root"
#   Dry run: ansible-playbook playbooks/vps-bootstrap.yml -l srv1517572 -e "ansible_port=22 ansible_user=root" --check

- name: Bootstrap fresh VPS
  hosts: vps_hosts
  become: false  # already root
  gather_facts: yes

  tasks:
    # ============================================================
    # Section 1: System Update
    # ============================================================
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes

    # ============================================================
    # Section 2: Create User
    # ============================================================
    - name: Create vlad user
      ansible.builtin.user:
        name: vlad
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes

    - name: Add passwordless sudo for vlad
      ansible.builtin.copy:
        dest: /etc/sudoers.d/vlad
        content: "vlad ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        owner: root
        group: root
        validate: visudo -cf %s

    - name: Create .ssh directory for vlad
      ansible.builtin.file:
        path: /home/vlad/.ssh
        state: directory
        owner: vlad
        group: vlad
        mode: "0700"

    - name: Deploy SSH authorized key for vlad
      ansible.builtin.copy:
        src: "{{ vps_ssh_pubkey_file }}"
        dest: /home/vlad/.ssh/authorized_keys
        owner: vlad
        group: vlad
        mode: "0600"

    # ============================================================
    # Section 3: Set Hostname
    # ============================================================
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Update /etc/hosts with hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ inventory_hostname }}"
        state: present

    # ============================================================
    # Section 4: Install Base Packages
    # ============================================================
    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ vps_base_packages }}"
        state: present

    # ============================================================
    # Section 5: SSH Hardening
    # ============================================================
    - name: Ensure sshd privilege separation directory exists
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Set SSH port
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port '
        line: "Port {{ vps_ssh_port }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'

    - name: Disable SSH root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: "PermitRootLogin no"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'

    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: "PasswordAuthentication no"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'

    - name: Enable SSH public key authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PubkeyAuthentication'
        line: "PubkeyAuthentication yes"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'

    - name: Set SSH MaxAuthTries
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?MaxAuthTries'
        line: "MaxAuthTries {{ vps_ssh_max_auth_tries }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'

    - name: Set SSH LoginGraceTime
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?LoginGraceTime'
        line: "LoginGraceTime {{ vps_ssh_login_grace_time }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'

    # ============================================================
    # Section 6: UFW Firewall (allow SSH on new port BEFORE enabling)
    # ============================================================
    - name: Set UFW default deny incoming
      ansible.builtin.shell: ufw default deny incoming
      register: ufw_deny
      changed_when: "'updated' in ufw_deny.stdout | lower"

    - name: Set UFW default allow outgoing
      ansible.builtin.shell: ufw default allow outgoing
      register: ufw_allow
      changed_when: "'updated' in ufw_allow.stdout | lower"

    - name: Allow default UFW ports
      ansible.builtin.shell: ufw allow "{{ item.port }}/{{ item.proto }}" comment "{{ item.comment }}"
      loop: "{{ vps_ufw_default_ports }}"
      register: ufw_defaults
      changed_when: "'added' in ufw_defaults.stdout | lower"

    - name: Allow per-host extra UFW ports
      ansible.builtin.shell: ufw allow "{{ item.port }}/{{ item.proto }}" comment "{{ item.comment }}"
      loop: "{{ vps_ufw_extra_ports }}"
      register: ufw_extra
      changed_when: "'added' in ufw_extra.stdout | lower"
      when: vps_ufw_extra_ports | length > 0

    - name: Enable UFW
      ansible.builtin.shell: ufw --force enable
      register: ufw_enable
      changed_when: "'active' in ufw_enable.stdout and 'already' not in ufw_enable.stdout"

    # ============================================================
    # Section 7: Fail2ban
    # ============================================================
    - name: Configure fail2ban jail
      ansible.builtin.template:
        src: vps-fail2ban-jail.local.j2
        dest: /etc/fail2ban/jail.local
        mode: '0644'

    - name: Enable and start fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
        enabled: yes

    # ============================================================
    # Section 8: Unattended Upgrades
    # ============================================================
    - name: Configure unattended-upgrades for security only
      ansible.builtin.copy:
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
          };
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: '0644'

    - name: Enable auto-updates timer
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'

    # ============================================================
    # Section 9: MOTD Dashboard
    # ============================================================
    - name: Disable default Ubuntu MOTD scripts
      ansible.builtin.file:
        path: "/etc/update-motd.d/{{ item }}"
        mode: "0644"
      loop: "{{ vps_motd_disable_defaults }}"
      failed_when: false  # file may not exist on all systems

    - name: Deploy custom MOTD dashboard
      ansible.builtin.template:
        src: vps-motd-dashboard.sh.j2
        dest: /etc/update-motd.d/01-dashboard
        mode: "0755"
        owner: root
        group: root

    # ============================================================
    # Section 10: Sudoers for fail2ban-client (MOTD)
    # ============================================================
    - name: Allow vlad to run fail2ban-client without password
      ansible.builtin.copy:
        dest: /etc/sudoers.d/vlad-fail2ban
        content: "vlad ALL=(ALL) NOPASSWD: /usr/bin/fail2ban-client\n"
        mode: "0440"
        owner: root
        group: root
        validate: visudo -cf %s

    # ============================================================
    # Section 11: Restart SSH and reboot
    # ============================================================
    - name: Restart SSH with new config
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Set ansible_port to new SSH port for reboot reconnection
      ansible.builtin.set_fact:
        ansible_port: "{{ vps_ssh_port }}"

    - name: Reboot to apply all changes
      ansible.builtin.reboot:
        reboot_timeout: 300
        msg: "VPS bootstrap complete — rebooting"
