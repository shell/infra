---
# Docker hygiene — prune images, volumes, networks, build cache
#
# Usage:
#   All hosts:    ansible-playbook playbooks/docker-cleanup.yml
#   Single host:  ansible-playbook playbooks/docker-cleanup.yml -l servarr
#   With notify:  ansible-playbook playbooks/docker-cleanup.yml -e notify_telegram=true

- name: Docker cleanup and disk reclamation
  hosts: docker_hosts
  become: no
  gather_facts: no

  tasks:
    - name: Capture docker disk usage before
      ansible.builtin.shell: docker system df
      register: docker_df_before
      changed_when: false

    - name: Prune unused images
      ansible.builtin.shell: docker image prune -af
      register: image_prune
      when: docker_cleanup.prune_images | bool

    - name: Prune anonymous volumes
      ansible.builtin.shell: docker volume prune -f
      register: volume_prune
      when: docker_cleanup.prune_volumes | bool

    - name: Prune unused networks
      ansible.builtin.shell: docker network prune -f
      register: network_prune
      when: docker_cleanup.prune_networks | bool

    - name: Prune build cache
      ansible.builtin.shell: docker builder prune -af
      register: builder_prune
      when: docker_cleanup.prune_build_cache | bool

    - name: Capture docker disk usage after
      ansible.builtin.shell: docker system df
      register: docker_df_after
      changed_when: false

    - name: Display before/after results
      ansible.builtin.debug:
        msg:
          - "=== {{ inventory_hostname }} ==="
          - "--- Before ---"
          - "{{ docker_df_before.stdout_lines }}"
          - "--- After ---"
          - "{{ docker_df_after.stdout_lines }}"

    - name: Send Telegram summary
      ansible.builtin.uri:
        url: "{{ telegram.api_url }}/bot{{ telegram.bot_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram.chat_id }}"
          text: |
            Docker Cleanup Complete
            {% for host in ansible_play_hosts %}
            {{ host }}: done
            {% endfor %}
          parse_mode: HTML
        status_code: 200
      run_once: true
      when: notify_telegram | default(false) | bool
