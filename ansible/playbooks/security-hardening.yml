---
# Security hardening — SSH, Tailscale forwarding, fail2ban, unattended-upgrades, UFW (firewall.yml)
#
# Usage:
#   All hosts:    ansible-playbook playbooks/security-hardening.yml -K
#   Single host:  ansible-playbook playbooks/security-hardening.yml -l ts-router -K
#   Dry run:      ansible-playbook playbooks/security-hardening.yml -K --check

- name: Security hardening for Docker hosts
  hosts: docker_hosts
  become: true

  tasks:
    # ============================================================
    # Section 1: SSH Hardening
    # ============================================================
    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: "PasswordAuthentication no"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    - name: Disable SSH root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: "PermitRootLogin no"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    - name: Set SSH MaxAuthTries
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?MaxAuthTries'
        line: "MaxAuthTries {{ security.ssh_max_auth_tries }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    # UFW is managed declaratively by firewall.yml (imported at the end).

    # ============================================================
    # Section 2: Tailscale subnet router / exit node (ts-router only)
    # ============================================================
    - name: Enable IP forwarding (net.ipv4.ip_forward)
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes
      when: tailscale_config is defined

    - name: Enable IPv6 forwarding
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes
      when: tailscale_config is defined

    # ============================================================
    # Section 3: fail2ban
    # ============================================================
    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present

    - name: Configure fail2ban SSH jail
      ansible.builtin.copy:
        content: |
          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          maxretry = {{ security.fail2ban_max_retry }}
          bantime = {{ security.fail2ban_ban_time }}
          findtime = 600
          backend = systemd
        dest: /etc/fail2ban/jail.local
        mode: '0644'
      notify: Restart fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: yes

    # ============================================================
    # Section 4: Unattended Upgrades (security only)
    # ============================================================
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Configure unattended-upgrades for security only
      ansible.builtin.copy:
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
          };
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: '0644'

    - name: Enable auto-updates timer
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

- name: Host firewall
  ansible.builtin.import_playbook: firewall.yml
