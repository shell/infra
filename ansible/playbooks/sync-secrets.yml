---
# Sync secrets from encrypted files to hosts
#
# Usage:
#   ansible-playbook playbooks/sync-secrets.yml
#   ansible-playbook playbooks/sync-secrets.yml -l servarr

- name: Sync secrets to Docker hosts
  hosts: docker_hosts
  become: true
  vars:
    base_path: "/home/{{ ansible_user }}"
    repo_cluster_path: "{{ playbook_dir }}/../../cluster"

  tasks:
    - name: Set source directory (matches inventory hostname)
      ansible.builtin.set_fact:
        source_base: "{{ repo_cluster_path }}/{{ inventory_hostname }}"

    - name: Find encrypted secret files
      ansible.builtin.find:
        paths: "{{ source_base }}"
        patterns: "*.env.enc"
        recurse: yes
        hidden: yes
      delegate_to: localhost
      become: false
      register: encrypted_files

    - name: Decrypt secrets locally
      ansible.builtin.shell: |
        sops --decrypt --input-type dotenv --output-type dotenv "{{ item.path }}"
      loop: "{{ encrypted_files.files }}"
      when: encrypted_files.files | length > 0
      register: decrypted_env
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true  # Don't log secrets

    - name: Write decrypted secrets to remote
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "{{ base_path }}/{{ item.item.path | regex_replace('^' + (source_base | realpath) + '/', '') | regex_replace('\\.enc$', '') }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      loop: "{{ decrypted_env.results }}"
      when: item.stdout is defined
      no_log: true
