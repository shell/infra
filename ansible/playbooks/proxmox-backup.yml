---
# Proxmox VM backups → Proxmox Backup Server (VM 106) → Backblaze B2
#
# Manages, on the PVE host:
#   - PBS storage entry (client-side encrypted, key autogenerated once)
#   - backup=0 on data disks we deliberately don't back up
#   - nightly backup job (all VMs except PBS itself)
#   - Telegram alert on backup failure (webhook + matcher)
# PBS itself (VM install, B2 datastore, prune/GC/verify) is set up by hand:
# see docs/proxmox-backup.md.
#
# Usage:
#   ansible-playbook playbooks/proxmox-backup.yml -l pve-nuc --check --diff
#   ansible-playbook playbooks/proxmox-backup.yml -l pve-nuc

- name: Configure Proxmox VM backups to PBS
  hosts: proxmox
  become: no
  gather_facts: no
  vars:
    pb: "{{ proxmox_backup }}"
    repo_root: "{{ playbook_dir }}/../.."
    pbs_secrets_file: "{{ playbook_dir }}/../secrets/pbs.secret.yml"
    key_file: "/etc/pve/priv/storage/{{ pb.storage_id }}.enc"
    # PVE Handlebars templates (rendered by PVE, not Ansible → !unsafe)
    tg_url_tmpl: !unsafe "https://api.telegram.org/bot{{ secrets.token }}/sendMessage"
    tg_body_tmpl: !unsafe '{"chat_id": "{{ secrets.chat_id }}", "text": "🔴 Proxmox: {{ escape title }}\nCheck pve-nuc → Datacenter → Backup / Tasks."}'

  tasks:
    - name: Skip offline hosts
      ansible.builtin.meta: end_host
      when: expected_offline | default(false) | bool

    - name: Require PBS connection details
      ansible.builtin.assert:
        that:
          - pb.pbs_server | length > 0
          - pb.pbs_fingerprint | length > 0
        fail_msg: >-
          Set proxmox_backup.pbs_server and pbs_fingerprint in
          inventory/group_vars/proxmox.yml (docs/proxmox-backup.md step 3).

    # --- Secrets (decrypted on the controller, never logged) ---
    - name: Decrypt PBS secrets
      ansible.builtin.command: sops --decrypt "{{ pbs_secrets_file }}"
      register: _pbs_raw
      delegate_to: localhost
      run_once: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: Decrypt Telegram credentials (shared with alertmanager)
      ansible.builtin.command: >-
        sops --decrypt --input-type dotenv --output-type json
        "{{ repo_root }}/{{ pb.telegram_env_file }}"
      register: _tg_raw
      delegate_to: localhost
      run_once: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: Load secrets
      ansible.builtin.set_fact:
        pbs_token_secret: "{{ (_pbs_raw.stdout | from_yaml).pbs_token_secret }}"
        tg_token: "{{ (_tg_raw.stdout | from_json).TELEGRAM_BOT_TOKEN }}"
        tg_chat: "{{ (_tg_raw.stdout | from_json).TELEGRAM_CHAT_ID }}"
      no_log: true

    # --- PBS storage ---
    - name: Read PBS storage config
      ansible.builtin.command: pvesh get /storage/{{ pb.storage_id }} --output-format json
      register: _storage
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Check for existing encryption key
      ansible.builtin.stat:
        path: "{{ key_file }}"
      register: _key

    - name: Add PBS storage (generates the encryption key on first add)
      ansible.builtin.command:
        argv: "{{ base + ([] if _key.stat.exists else ['--encryption-key', 'autogen']) }}"
      vars:
        base:
          - pvesm
          - add
          - pbs
          - "{{ pb.storage_id }}"
          - --server
          - "{{ pb.pbs_server }}"
          - --datastore
          - "{{ pb.pbs_datastore }}"
          - --username
          - "{{ pb.pbs_username }}"
          - --password
          - "{{ pbs_token_secret }}"
          - --fingerprint
          - "{{ pb.pbs_fingerprint }}"
          - --content
          - backup
          # Retention is done by the PBS prune job, not by PVE
          - --prune-backups
          - keep-all=1
      when: _storage.rc != 0
      register: _add
      failed_when: false
      no_log: true  # argv carries the token

    # pvesm's error text doesn't contain the token, so surface it
    - name: Fail with pvesm's error if adding the storage failed
      ansible.builtin.fail:
        msg: "pvesm add failed: {{ _add.stderr | default('') }}"
      when: _add is not skipped and _add.rc != 0

    - name: Update PBS server/fingerprint if they changed
      ansible.builtin.command:
        argv:
          - pvesm
          - set
          - "{{ pb.storage_id }}"
          - --server
          - "{{ pb.pbs_server }}"
          - --fingerprint
          - "{{ pb.pbs_fingerprint }}"
      when:
        - _storage.rc == 0
        - (_storage.stdout | from_json).server != pb.pbs_server
          or (_storage.stdout | from_json).fingerprint != pb.pbs_fingerprint

    # --- Data disks excluded from backup ---
    - name: Read excluded disk configs
      ansible.builtin.shell: >-
        set -o pipefail;
        qm config {{ item.vmid }} | awk -F': ' '$1 == "{{ item.disk }}" {print $2}'
      args:
        executable: /bin/bash
      loop: "{{ pb.excluded_disks }}"
      register: _disks
      changed_when: false
      check_mode: false
      failed_when: _disks.rc != 0 or _disks.stdout | length == 0

    - name: Set backup=0 on excluded disks (keeps all other disk options)
      ansible.builtin.command:
        argv:
          - qm
          - set
          - "{{ item.item.vmid }}"
          - "--{{ item.item.disk }}"
          - >-
            {{ item.stdout | regex_replace('backup=1', 'backup=0')
               if 'backup=' in item.stdout else item.stdout ~ ',backup=0' }}
      loop: "{{ _disks.results }}"
      loop_control:
        label: "{{ item.item.vmid }}:{{ item.item.disk }}"
      when: "'backup=0' not in item.stdout"

    # --- Backup job ---
    - name: Read backup job
      ansible.builtin.command: pvesh get /cluster/backup/{{ pb.job_id }} --output-format json
      register: _job
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Compute desired backup job
      ansible.builtin.set_fact:
        job_desired:
          schedule: "{{ pb.schedule }}"
          storage: "{{ pb.storage_id }}"
          mode: snapshot
          all: "1"
          exclude: "{{ pb.pbs_vmid | string }}"
          enabled: "1"
          notification-mode: notification-system
          comment: "Managed by Ansible (proxmox-backup.yml)"
        job_current: "{{ (_job.stdout | from_json) if _job.rc == 0 else {} }}"

    - name: Diff backup job against desired settings
      ansible.builtin.set_fact:
        job_drift: >-
          {%- set ns = namespace(d=[]) -%}
          {%- for k, v in job_desired.items() -%}
          {%- if (job_current[k] | default('') | string) != (v | string) -%}
          {%- set ns.d = ns.d + [k] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.d }}
        job_args: >-
          {%- set ns = namespace(a=[]) -%}
          {%- for k, v in job_desired.items() -%}
          {%- set ns.a = ns.a + ['--' ~ k, v | string] -%}
          {%- endfor -%}
          {{ ns.a }}

    - name: Create or update backup job
      ansible.builtin.command:
        argv: >-
          {{ (['pvesh', 'create', '/cluster/backup', '--id', pb.job_id]
              if _job.rc != 0 else
              ['pvesh', 'set', '/cluster/backup/' ~ pb.job_id]) + job_args }}
      when: job_drift | length > 0

    # --- Failure alerts via Telegram ---
    - name: Check for Telegram webhook target
      ansible.builtin.command: pvesh get /cluster/notifications/endpoints/webhook/telegram --output-format json
      register: _wh
      changed_when: false
      failed_when: false
      check_mode: false

    # Create-only: to change it, delete the target in the UI and rerun.
    # API takes body/secret values base64-encoded. Title only: the full
    # vzdump log can exceed Telegram's 4096-char limit and get rejected.
    - name: Create Telegram webhook target
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/notifications/endpoints/webhook
          - --name
          - telegram
          - --method
          - post
          - --url
          - "{{ tg_url_tmpl }}"
          - --header
          - "name=Content-Type,value={{ 'application/json' | b64encode }}"
          - --body
          - "{{ tg_body_tmpl | b64encode }}"
          - --secret
          - "name=token,value={{ tg_token | b64encode }}"
          - --secret
          - "name=chat_id,value={{ tg_chat | string | b64encode }}"
          - --comment
          - Managed by Ansible (proxmox-backup.yml)
      when: _wh.rc != 0
      no_log: true

    - name: Check for backup-failure matcher
      ansible.builtin.command: pvesh get /cluster/notifications/matchers/backup-failures --output-format json
      register: _matcher
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Create backup-failure matcher
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/notifications/matchers
          - --name
          - backup-failures
          - --target
          - telegram
          - --match-field
          - exact:type=vzdump
          - --match-severity
          - error
          - --comment
          - Managed by Ansible (proxmox-backup.yml)
      when: _matcher.rc != 0

    # --- Key escrow reminder (never print the key) ---
    - name: Check encryption key exists
      ansible.builtin.stat:
        path: "{{ key_file }}"
      register: _key_after

    - name: Remind to escrow the encryption key
      ansible.builtin.debug:
        msg: >-
          Encryption key present at {{ key_file }}: {{ _key_after.stat.exists }}.
          Without this key the B2 backups are unreadable. It must be in SOPS
          (ansible/secrets/pbs-encryption-key.secret.json) AND your password
          manager. See docs/proxmox-backup.md step 5.
