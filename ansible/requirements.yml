---
# Galaxy collections used by the playbooks. Pinned for reproducible runs;
# bump versions here in a commit to upgrade.
#
# Install: ansible-galaxy collection install -r requirements.yml
collections:
  - name: prometheus.prometheus
    version: 0.30.2
  - name: community.beszel
    version: 2.1.0
  # Exact pins = what the runner resolved before pinning (no behaviour change).
  # CI only reinstalls when this file's hash changes (see workflows).
  - name: community.general
    version: 14.0.1
  - name: ansible.posix
    version: 1.5.4
