services:
  france-guide:
    build: .
    container_name: france-guide
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.france-guide.rule=Host(`france-guide.penk.in`)"
      - "traefik.http.routers.france-guide.entrypoints=https"
      - "traefik.http.routers.france-guide.tls.certresolver=cloudflare"
      - "traefik.http.services.france-guide.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
