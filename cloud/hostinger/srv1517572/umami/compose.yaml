services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    networks:
      - proxy
      - umami
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@umami-db:5432/umami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`umami.penk.in`)"
      - "traefik.http.routers.umami.entrypoints=https"
      - "traefik.http.routers.umami.tls.certresolver=cloudflare"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  umami-db:
    image: postgres:17-alpine
    container_name: umami-db
    restart: unless-stopped
    networks:
      - umami
    env_file:
      - .env
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  umami-db-data:

networks:
  proxy:
    external: true
  umami:
    driver: bridge
