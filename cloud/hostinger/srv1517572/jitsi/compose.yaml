services:
  web:
    image: ghcr.io/jitsi/web:stable-11248-1
    container_name: jitsi-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    networks:
      - proxy
      - meet.jitsi
    volumes:
      - ${CONFIG}/web:/config:Z
      - ${CONFIG}/storage/web:/storage:Z
      - ${CONFIG}/storage/transcripts:/usr/share/jitsi-meet/transcripts:ro,z
    env_file:
      - .env
    environment:
      - DISABLE_HTTPS=1
      - ENABLE_HTTP_REDIRECT=0
      - JICOFO_AUTH_LIFETIME="168 hours"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jitsi.rule=Host(`meet.penk.in`)"
      - "traefik.http.routers.jitsi.entrypoints=https"
      - "traefik.http.routers.jitsi.tls.certresolver=cloudflare"
      - "traefik.http.services.jitsi.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"
    depends_on:
      - jvb

  prosody:
    image: ghcr.io/jitsi/prosody:stable-11248-1
    container_name: jitsi-prosody
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    networks:
      meet.jitsi:
        aliases:
          - xmpp.meet.jitsi
    volumes:
      - ${CONFIG}/prosody/config:/config:Z
      - ${CONFIG}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
      - ${CONFIG}/storage/prosody:/var/lib/prosody:Z
    env_file:
      - .env

  jicofo:
    image: ghcr.io/jitsi/jicofo:stable-11248-1
    container_name: jitsi-jicofo
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=32M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    networks:
      - meet.jitsi
    volumes:
      - ${CONFIG}/jicofo:/config:Z
    env_file:
      - .env
    depends_on:
      - prosody

  jvb:
    image: ghcr.io/jitsi/jvb:stable-11248-1
    container_name: jitsi-jvb
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=32M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    networks:
      - meet.jitsi
    ports:
      - "10000:10000/udp"
    volumes:
      - ${CONFIG}/jvb:/config:Z
    env_file:
      - .env
    depends_on:
      - prosody

networks:
  proxy:
    external: true
  meet.jitsi:
    driver: bridge
